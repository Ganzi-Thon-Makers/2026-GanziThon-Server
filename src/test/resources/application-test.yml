spring:
  docker:
    compose:
      enabled: false
  datasource:
      url: jdbc:mysql://127.0.0.1:3306/ganzithon_test
      username: test_user
      password: test_password
      driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

# Context test creates S3Client but does not call external storage.
# Storage integration tests should use a stub endpoint, never real account keys.
# Test-only signing key; never use real secrets here.
jwt:
  secret: dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItY29udGV4dC10ZXN0LW9ubHk=
  access-expiry-ms: 86400000
  refresh-expiry-ms: 2592000000

ncp:
  storage:
    endpoint: http://127.0.0.1:9000
    region: kr-standard
    bucket: ci-test-bucket
    access-key: ci-test-access-key
    secret-key: ci-test-secret-key
    public-base-url: http://127.0.0.1:9000/ci-test-bucket
