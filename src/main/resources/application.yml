spring:
  application:
    name: makers-server
  docker:
    compose:
      enabled: false
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

ncp:
  storage:
    endpoint: https://kr.object.ncloudstorage.com
    region: kr-standard
    bucket: ${NCP_BUCKET}
    access-key: ${NCP_ACCESS_KEY}
    secret-key: ${NCP_SECRET_KEY}
    public-base-url: ${ncp.storage.endpoint}/${ncp.storage.bucket}
