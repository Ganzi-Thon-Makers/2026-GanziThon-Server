spring:
  application:
    name: makers-server
  docker:
    compose:
      enabled: false
  profiles:
    active: local

springdoc:
  swagger-ui:
    urls-primary-name: service
    display-request-duration: true

ncp:
  storage:
    endpoint: https://kr.object.ncloudstorage.com
    region: kr-standard
    bucket: ${NCP_BUCKET}
    access-key: ${NCP_ACCESS_KEY}
    secret-key: ${NCP_SECRET_KEY}
    public-base-url: https://kr.object.ncloudstorage.com/${NCP_BUCKET}
