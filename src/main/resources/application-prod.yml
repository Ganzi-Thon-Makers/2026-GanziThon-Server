server:
  port: ${SERVER_PORT}
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USER}
    password: ${PROD_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update # 첫 배포만 update로 띄워서 테이블 생성 -> 이후 validate로 전환 필요

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    urls-primary-name: Platform API
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origin-patterns: https://ganzithon.com,https://www.ganzithon.com,https://admin.ganzithon.com,https://api.ganzithon.com,https://admin-api.ganzithon.com
  swagger:
    backoffice-server-url: https://admin-api.ganzithon.com
