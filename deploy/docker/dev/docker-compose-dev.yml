name: ganzithon-dev

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    build:
      context: ../../..
      dockerfile: Dockerfile
    image: ganzithon-server:dev
    container_name: ganzithon-dev-app
    restart: unless-stopped

    # Docker 로그 관리
    logging: *default-logging

    # 환경 변수
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      # NCP MySQL
      DEV_DB_URL: ${DEV_DB_URL:?DEV_DB_URL is required}
      DEV_DB_USER: ${DEV_DB_USER:?DEV_DB_USER is required}
      DEV_DB_PASSWORD: ${DEV_DB_PASSWORD:?DEV_DB_PASSWORD is required}
      # NCP Object Storage
      NCP_BUCKET: ${NCP_BUCKET:?NCP_BUCKET is required}
      NCP_ACCESS_KEY: ${NCP_ACCESS_KEY:?NCP_ACCESS_KEY is required}
      NCP_SECRET_KEY: ${NCP_SECRET_KEY:?NCP_SECRET_KEY is required}

    # Docker 내부 네트워크
    networks:
      - ganzithon-dev

    # Spring Boot Health Check
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || curl -fsS -o /dev/null http://127.0.0.1:8080/actuator/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.28-alpine
    container_name: ganzithon-dev-nginx
    restart: unless-stopped

    # Docker 로그 관리
    logging: *default-logging
    # HTTP / HTTPS
    ports:
      - "80:80"
      - "443:443"

    # Nginx 설정 및 SSL 인증서
    volumes:
      # Nginx 설정
      - ../../nginx/dev/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Let's Encrypt SSL 인증서
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Certbot 인증 경로
      - /var/www/certbot:/var/www/certbot:ro

    # Spring Boot가 정상 상태가 된 후 실행
    depends_on:
      app:
        condition: service_healthy

    # Docker 내부 네트워크
    networks:
      - ganzithon-dev

    # Nginx Health Check
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

# Docker Network
networks:
  ganzithon-dev:
    name: ganzithon-dev
