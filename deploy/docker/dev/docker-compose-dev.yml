name: ganzithon-dev

# 컨테이너 로그가 디스크를 채우지 않도록 로테이션 (서비스당 최대 약 30MB)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: ../../..
      dockerfile: Dockerfile
    image: ganzithon-server:dev
    container_name: ganzithon-dev-app
    restart: unless-stopped
    logging: *default-logging
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080

      DEV_DB_URL: ${DEV_DB_URL:?DEV_DB_URL is required}
      DEV_DB_USER: ${DEV_DB_USER:?DEV_DB_USER is required}
      DEV_DB_PASSWORD: ${DEV_DB_PASSWORD:?DEV_DB_PASSWORD is required}

      NCP_BUCKET: ${NCP_BUCKET:?NCP_BUCKET is required}
      NCP_ACCESS_KEY: ${NCP_ACCESS_KEY:?NCP_ACCESS_KEY is required}
      NCP_SECRET_KEY: ${NCP_SECRET_KEY:?NCP_SECRET_KEY is required}
    networks:
      - ganzithon-dev
    healthcheck:
      # 베이스 이미지에 wget이 없어도 curl로 대체되도록 fallback 구성
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || curl -fsS -o /dev/null http://127.0.0.1:8080/actuator/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  nginx:
    image: nginx:1.28-alpine
    container_name: ganzithon-dev-nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../nginx/dev/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - ganzithon-dev
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  ganzithon-dev:
    name: ganzithon-dev
