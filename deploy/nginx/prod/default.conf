# HTTP
server {
    listen 80;
    server_name api.ganzithon.com admin-api.ganzithon.com;
    # Certbot 인증
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    # Nginx Health Check
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }
    # HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
# HTTPS
server {
    listen 443 ssl;
    http2 on;

    server_name api.ganzithon.com admin-api.ganzithon.com;

    # SSL
    ssl_certificate /etc/letsencrypt/live/api.ganzithon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ganzithon.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;

    # Docker DNS: 컨테이너 재생성으로 IP가 바뀌어도 요청 시점에 다시 해석한다
    resolver 127.0.0.11 valid=10s;

    # Blue/Green 활성 컨테이너 (deploy.sh가 전환 시 이 파일 내용을 갱신함)
    # 내용: set $upstream http://ganzithon-prod-app-(blue|green):8080;
    # 주의: conf.d/ 아래 파일은 http 레벨에서 자동 include돼서 `set` 사용 불가.
    # 그래서 별도 경로에 두고 server 블록 안에서만 include한다.
    include /etc/nginx/upstream-app.conf;

    # Proxy
    proxy_http_version 1.1;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Health Check
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Spring Boot
    location / {
        proxy_pass $upstream;
    }
}
