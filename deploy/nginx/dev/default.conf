server {
    listen 80;
    server_name dev-api.ganzithon.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;

    server_name dev-api.ganzithon.com;

    # SSL 설정
    ssl_certificate /etc/letsencrypt/live/dev-api.ganzithon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-api.ganzithon.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 이미지 업로드 대비 (Spring의 multipart max-file-size와 맞출 것)
    client_max_body_size 25m;

    # 프록시 공통 설정 (app이 늦게 떠도 nginx가 죽지 않도록 변수 + resolver 사용)
    resolver 127.0.0.11 valid=10s;
    set $upstream http://app:8080;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # 헬스체크
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass $upstream;
    }
}
