server {
    listen 80;
    server_name dev-api.ganzithon.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Docker Compose Health Check
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        default_type text/plain;
        return 200 "GANZITHON DEV HTTP OK\n";
    }
}
