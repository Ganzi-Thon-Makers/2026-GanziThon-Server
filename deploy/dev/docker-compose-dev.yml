name: ganzithon-dev

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ganzithon-server:dev
    container_name: ganzithon-dev-app
    restart: unless-stopped
    # 환경 변수
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080

      DEV_DB_URL: ${DEV_DB_URL}
      DEV_DB_USER: ${DEV_DB_USER}
      DEV_DB_PASSWORD: ${DEV_DB_PASSWORD}

    networks:
      - ganzithon-dev
    healthcheck:
      test:
        [
          "CMD-SMELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  nginx:
    image: nginx:1.28-alpine
    container_name: ganzithon-dev-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro

    depends_on:
      app:
        condition: service_healthy

    networks:
      - ganzithon-dev

    healthcheck:
      test:
        [
            "CMD-SMELL",
            "wget -q -O /dev/null http://127.0.0.1/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  ganzithon-dev:
    name: ganzithon-dev
